# ===================================================================
# DSA Revision Tracker - Application Configuration
# ===================================================================

# Application Identity & Server
spring.application.name=dsa-revision-backend
server.port=${PORT:8080}

# ===================================================================
# PostgreSQL Database Configuration
# Environment variables:
#   DB_HOST     - PostgreSQL server host (default: localhost)
#   DB_PORT     - PostgreSQL server port (default: 5432)
#   DB_NAME     - Database name (default: dsa_revision)
#   DB_USER     - Database username (default: postgres)
#   DB_PASSWORD - Database password (default: postgres)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dsa_revision}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# Spring Data JPA & Hibernate
# ===================================================================
# ddl-auto: 'update' will automatically validate and update schema tables for local dev
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# CORS Configuration (Vite React Frontend)
# Environment variable:
#   CORS_ALLOWED_ORIGINS - Comma-separated list of allowed web origins
# ===================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===================================================================
# JWT Authentication Configuration
# Environment variables:
#   JWT_SECRET        - Base64 or plain secret key (min 256-bit for HS256)
#   JWT_EXPIRATION_MS - Token lifespan in milliseconds (default: 86400000 = 24h)
# ===================================================================
app.jwt.secret=${JWT_SECRET:dsaRevisionTrackerSuperSecretKeyThatIsAtLeast32BytesLongForHmacSha256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Logging
# ===================================================================
logging.level.root=INFO
logging.level.com.dsarevision=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
