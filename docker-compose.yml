services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsa-revision-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=dsa_revision
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JPA_DDL_AUTO=update
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - JWT_SECRET=dsaRevisionTrackerSuperSecretKeyThatIsAtLeast32BytesLongForHmacSha256
      - JWT_EXPIRATION_MS=86400000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: dsa-revision-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsa_revision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dsa_revision"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

